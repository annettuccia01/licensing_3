<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/pages/admin/admin.css">
</head>
<body>
    <div id="adminPanel">
        <nav class="navbar">
            <div class="container">
                <h1>Админ-панель</h1>
                <button onclick="logout()">Выйти</button>
            </div>
        </nav>
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('users')">Пользователи</button>
                <button class="tab-btn" onclick="showTab('products')">Продукты</button>
            </div>
            <div id="users" class="tab-content active">
                <div class="header">
                    <h2>Управление пользователями</h2>
                    <button class="add-btn" onclick="openUserModal()">Добавить пользователя</button>
                </div>
                <div class="search-filter">
                    <input type="text" id="userSearch" placeholder="Поиск по имени/фамилии" oninput="filterUsers()">
                    <select id="userRoleFilter" onchange="filterUsers()">
                        <option value="">Все роли</option>
                        <option value="admin">Админ</option>
                        <option value="user">Пользователь</option>
                    </select>
                </div>
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Фамилия</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Роль</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
            <div id="products" class="tab-content">
                <div class="header">
                    <h2>Управление продуктами</h2>
                    <button class="add-btn" onclick="openProductModal()">Добавить продукт</button>
                </div>
                <div class="search-filter">
                    <input type="text" id="productSearch" placeholder="Поиск по названию" oninput="filterProducts()">
                    <select id="productCategoryFilter" onchange="filterProducts()">
                        <option value="">Все категории</option>
                        <option value="Hair, skin and nails">Hair, skin and nails</option>
                        <option value="Omega and Fish oil">Omega and Fish oil</option>
                        <option value="Women's health">Women's health</option>
                        <option value="Detox">Detox</option>
                        <option value="Sleep">Sleep</option>
                        <option value="Protein">Protein</option>
                        <option value="Weight control">Weight control</option>
                        <option value="Brain activity">Brain activity</option>
                    </select>
                </div>
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Бренд</th>
                            <th>Цена</th>
                            <th>Рейтинг</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal" id="userModal">
        <div class="modal-content">
            <h3 id="userModalTitle">Добавить пользователя</h3>
            <input type="text" id="userLastName" placeholder="Фамилия">
            <input type="text" id="userFirstName" placeholder="Имя">
            <input type="text" id="userMiddleName" placeholder="Отчество">
            <input type="text" id="userPhone" placeholder="Телефон">
            <input type="email" id="userEmail" placeholder="Email">
            <input type="date" id="userBirthdate" placeholder="Дата рождения">
            <input type="text" id="userNickname" placeholder="Никнейм">
            <input type="password" id="userPassword" placeholder="Пароль">
            <select id="userRole">
                <option value="user">Пользователь</option>
                <option value="admin">Админ</option>
            </select>
            <div class="btn-group">
                <button class="cancel-btn" onclick="closeModal('userModal')">Отмена</button>
                <button class="save-btn" onclick="saveUser()">Сохранить</button>
            </div>
        </div>
    </div>
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h3 id="productModalTitle">Добавить продукт</h3>
            <input type="text" id="productName" placeholder="Название">
            <input type="text" id="productCategory" placeholder="Категория">
            <input type="text" id="productBrand" placeholder="Бренд">
            <textarea id="productDescription" placeholder="Описание"></textarea>
            <input type="number" id="productQuantityValue" placeholder="Количество">
            <input type="text" id="productQuantityUnit" placeholder="Единица измерения">
            <input type="number" id="productPrice" placeholder="Цена" step="0.01">
            <input type="number" id="productRating" placeholder="Рейтинг" step="0.1" min="0" max="5">
            <input type="text" id="productImg" placeholder="Путь к изображению">
            <div class="btn-group">
                <button class="cancel-btn" onclick="closeModal('productModal')">Отмена</button>
                <button class="save-btn" onclick="saveProduct()">Сохранить</button>
            </div>
        </div>
    </div>
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Подтверждение удаления</h3>
            <p id="confirmMessage"></p>
            <div class="btn-group">
                <button class="cancel-btn" onclick="closeModal('confirmModal')">Отмена</button>
                <button id="confirmButton" class="delete-btn">Удалить</button>
            </div>
        </div>
    </div>
    <script src="/pages/admin/admin.js"></script>
</body>
</html>
